services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  sqlite-data:
  n8n-data: